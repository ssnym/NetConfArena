r4_bgp_router_ids:
- 4.4.4.4
- 5.5.5.5
- 6.6.6.6
# Split the link pools so r4's default BGP router ID is always higher than r2's:
#   r2 interfaces use only 192.168.0.0/17   -> default RID <= 192.168.127.255
#   r4 interfaces use only 192.168.128.0/17 -> default RID >= 192.168.128.0
# Without an explicit BGP router ID, r3 must select r2 and check 4-3 must fail.
# Any value in r4_bgp_router_ids is below 192.168.x.x and makes r3 select r4.
# A shared /16 made about 40% of random instances pass 4-3 accidentally.
link1_media_options:
- fastethernet
link1_pool: 192.168.0.0/17
link1_prefix_lens:
- 24
link2_media_options:
- fastethernet
link2_pool: 192.168.128.0/17
link2_prefix_lens:
- 24
link3_media_options:
- fastethernet
link3_pool: 192.168.0.0/17
link3_prefix_lens:
- 24
link4_media_options:
- fastethernet
link4_pool: 192.168.128.0/17
link4_prefix_lens:
- 24
r1_loopback0_pool: 1.0.0.0/8
r1_loopback0_prefix_lens:
- 24
